<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="VocabMastery · 基于 SM-2 算法的英语单词科学记忆系统" />
  <meta name="theme-color" content="#0b0820" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VocabMastery" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>VocabMastery · 英语单词科学记忆</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">

    <!-- ============== Topbar ============== -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">V</div>
        <div class="brand-text">VocabMastery</div>
      </div>

      <nav id="tabs" class="tabs" aria-label="主导航"></nav>

      <select id="stage-select" class="stage-select" aria-label="切换词库"></select>
    </header>

    <!-- ============== Main View Container ============== -->
    <main id="view-container" class="view-container">
      <!-- Views rendered dynamically by app.js -->
    </main>

    <!-- ============== Login View Container ============== -->
    <div id="login-container" class="login-container" hidden></div>

    <!-- ============== Status Bar ============== -->
    <footer id="status-bar" class="statusbar">
      <span><span class="dot"></span>初始化中...</span>
      <span>v0.0.0</span>
    </footer>

  </div>

  <!-- Toast container (auto-injected by app.js) -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts (order matters: deps first, app.js last) -->
  <script src="js/api-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login-view.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/wrong-book.js"></script>
  <script src="js/word-detail-data.js"></script>
  <script src="js/study-lists.js"></script>
  <script src="js/recite-modes.js"></script>
  <script src="js/test-modes.js"></script>
  <script src="js/memory-palace.js"></script>
  <script src="js/reading.js"></script>
  <script src="js/feynman.js"></script>
  <script src="js/collocations.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/word-browser.js"></script>
  <script src="js/study-lists-view.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>

  <!-- PWA: 注册 Service Worker (离线缓存) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          console.log('[PWA] Service Worker 注册成功:', reg.scope);
        }).catch(function (err) {
          console.warn('[PWA] Service Worker 注册失败:', err);
        });
      });
    }
  </script>
</body>
</html>
