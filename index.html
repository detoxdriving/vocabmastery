  <!-- 关键:cache-bust URL 跳转,绕过 v5 SW 的 Cache-First -->
  <script>
    (function () {
      var VERSION_PARAM = 'v=20251107c'; // 每次部署改这个值
      // 如果 URL 里没有 ?v=20251107b,强制跳转到新 URL
      if (location.search.indexOf(VERSION_PARAM) < 0) {
        var newUrl = location.pathname +
          (location.search ? location.search + '&' : '?') +
          VERSION_PARAM +
          (location.hash || '');
        console.log('[cache-bust] redirect to', newUrl);
        location.replace(newUrl);
      } else {
        // 已有版本号,确保 URL 干净(去掉其他脏参数)
        console.log('[cache-bust] serving fresh version');
      }
    })();
  </script>

  <!-- PWA: 注册 Service Worker (离线缓存) -->
  <script>
    if ('serviceWorker' in navigator) {
      // 监听 SW 消息,如果 SW 发来 SW_NOOP_NOW_ACTIVE 立刻 reload
      navigator.serviceWorker.addEventListener('message', function (ev) {
        try {
          if (ev.data && ev.data.type === 'SW_NOOP_NOW_ACTIVE') {
            console.log('[PWA] 新 SW 已接管,自动 reload');
            window.location.reload();
          }
        } catch (e) {}
      });

      // 注册新 SW(install 时会 skipWaiting → activate → 给我发消息 → 我 reload)
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        // 如果已有 waiting SW,告诉它立刻接管
        if (reg.waiting) {
          reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        }
        // 监听新 SW 接管
        reg.addEventListener('updatefound', function () {
          var sw = reg.installing;
          if (sw) {
            sw.addEventListener('statechange', function () {
              if (sw.state === 'activated' && navigator.serviceWorker.controller) {
                console.log('[PWA] 新 SW 已激活,reload');
                window.location.reload();
              }
            });
          }
        });
        console.info('[PWA] SW 注册完成 scope=' + reg.scope);
      }).catch(function (err) {
        console.warn('[PWA] SW 注册失败', err);
      });
    }
  </script>
